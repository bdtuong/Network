<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Relay · Network collaboration</title><link rel="stylesheet" href="/style.css"></head><body><header><b>↗ RELAY</b><span>Private network workspace</span><strong id="status">Disconnected</strong></header><main><aside><h2>Your workspace</h2><form id="login"><label>Username<input id="username" required maxlength="24" placeholder="Alice"></label><label>Server address<input id="host" value="127.0.0.1" required></label><label>Server port<input id="port" type="number" value="9000" required></label><button>Connect to workspace</button></form><h3>Channels & people</h3><select id="recipient" size="8"><option value=""># Global chat</option></select><button id="logout" class="secondary">Disconnect</button><p>Encrypted UDP transport<br>Files verified with SHA-256</p></aside><section><div class="heading"><div><small>YOUR NETWORK, CONNECTED</small><h1 id="channel">Global chat</h1></div><span id="count">0 online</span></div><div id="messages" aria-live="polite"><article class="welcome"><h2>A space to work together.</h2><p>Connect, share a message, or send a file to someone on your network.</p></article></div><div id="notice" role="status"></div><form id="compose"><input id="text" placeholder="Write a message…" maxlength="600" required><button>Send ↗</button></form><div class="files"><label>Share a file with selected person <input type="file" id="file"></label><button id="upload" class="secondary">Send file</button></div></section></main><script src="/app.js"></script></body></html>
